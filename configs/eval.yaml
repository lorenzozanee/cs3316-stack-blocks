# Narrow evaluation configuration for one student checkpoint.
# The policy server and the Isaac client may share the same GPU.
task: stack_blocks
env_cfg: arx_x5
action_type: ee
seed: 0
# Ten curriculum layouts, one episode per layout (14 through 23).
eval_num: 10
# Optional: evaluate only these layout ids. Results renumber them 0..N-1 and
# layout_map.json in the run directory records the original ids.
